<app-header></app-header>
<main class="container pb-5 mb-2 mb-md-3" style="margin-top: 130px;">
    <app-loading *ngIf="isLoading"></app-loading>
    <form  [formGroup]="presupuestoForm" *ngIf="!isLoading">

        <!-- Campo: fecha -->
        <div class="mb-3 col-xs-12 col-sm-6 col-md-3">
            <label class="form-label fw-bold text-secondary mb-1">{{'Fecha'|translate}}</label>
            <input type="date" formControlName="fechaEvento" class="form-control form-control-lg bg-light">
            @if(presupuestoForm.controls['fechaEvento'].touched){

            <div class="text-danger">
                @if(presupuestoForm.controls['fechaEvento'].errors?.['required']){
                <span>{{'Campo requerido'}}</span>
                }
                @if(presupuestoForm.controls['fechaEvento'].errors?.['minlength']){
                <span>{{'Seleccione una fecha'}}</span>
                }
            </div>
            }
        </div>

        <!-- Fila de Personas y Hora -->
        <div class="row">
            <div class="col-xs-12 col-sm-6">
                <label class="form-label fw-bold text-secondary mb-1">{{'Personas'|translate}}</label>
                <input type="number" formControlName="cantidadPersonas" class="form-control form-control-lg bg-light"
                    [ngClass]="{'is-invalid': presupuestoForm.get('cantidadPersonas')?.touched && presupuestoForm.get('cantidadPersonas')?.invalid}">

            </div>
            <div class="col-xs-12 col-sm-6">
                <label class="form-label fw-bold text-secondary mb-1">{{'Hora' |translate}}</label>
                <select formControlName="hora" class="form-select form-select-lg bg-light"
                    [ngClass]="{'is-invalid': presupuestoForm.get('hora')?.touched && presupuestoForm.get('hora')?.invalid}">
                    <option value="15:30">15:30</option>
                    <option value="16:00">16:00</option>
                    <option value="16:30">16:30</option>
                    <option value="17:00">17:00</option>
                    <option value="17:30">17:30</option>
                    <option value="18:00">18:00</option>
                    <option value="18:30">18:30</option>
                    <option value="19:00">19:00</option>
                    <option value="19:30">19:30</option>
                    <option value="20:00">20:00</option>
                    <option value="20:30">20:30</option>
                </select>
            </div>
        </div>
        <!-- SECCIÓN: DETALLE DESCRIPCIÓN -->
        <div class="card shadow-sm border-0 mb-4 mt-3">
            <div class="card-body p-4">
                <h5 class="text-secondary text-uppercase fs-7 fw-bold mb-3">
                    <i class="bi bi-file-earmark-text-fill me-2"></i>Información del Presupuesto
                </h5>
                <div class="row g-3">
                    <!-- El contenedor padre maneja Reactive Forms, aquí asignamos correctamente tus formControlName -->
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
                        <input class="form-control" formControlName="title" type="text"
                            placeholder="Ej. Presupuesto para reunión">
                    </div>
                    <div class="col-12 col-md-8">
                        <label class="form-label fw-semibold">Descripción <span class="text-danger">*</span></label>
                        <textarea class="form-control" formControlName="description" rows="1"
                            placeholder="Detalles generales..."></textarea>
                    </div>
                </div>
            </div>
        </div>
        <!-- SECCIÓN: ITEMS -->
        <app-lista-casting *ngIf="!isLoading" [isVisible]="true" 
            [refreshCasProducts]="refreshCasProducts" >
        </app-lista-casting>

        <div class="row align-items-center">
            <div class="col-12">
                <div class="doctor-submit text-end">
                    <button type="button" class="btn btn-primary submit-form me-2" (click)="save()">Guardar</button>

                </div>
            </div>
        </div>
    </form>
</main>
