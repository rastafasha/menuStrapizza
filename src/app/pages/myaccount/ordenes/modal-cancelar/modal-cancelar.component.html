<div class="modal fade" [attr.id]="'sol_cancelar'" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cancelación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="bg-light py-grid-gutter px-grid-gutter rounded-lg">
                    <form #cancelarForm="ngForm" (ngSubmit)="cancelar(cancelarForm)">
                        <div class="form-group" *ngIf="msm_error_cancelar">
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                {{msm_error_cancelar}}
                                <button type="button" class="close" (click)="close_alert()" data-dismiss="alert"
                                    aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="review-text">Motivo de la cancelacion?<span class="text-danger">*</span></label>
                            <textarea class="form-control" rows="5" required="" name="mensaje"
                                [(ngModel)]="cancelacion.mensaje"
                                placeholder="Escribenos por qué estas solicitando la cancelación."></textarea>

                        </div>

                        <button class="btn btn-primary btn-shadow btn-block" type="submit">Solicitar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
