<app-header (refreshApp)="onRefreshFromHeader()"></app-header>

<app-loading *ngIf="isLoading"></app-loading>
<div *ngIf="!isLoading">
    <div class="clear"></div>
    <br>
    
    <!-- Catálogo Principal (Carga de inmediato) -->
    <!-- Eliminamos el filtro manual por texto; el componente interno ya sabe qué cargar usando la tienda activa -->
    <app-cas-products 
    *ngIf="!isLoading" 
    [activeCategory]="categoriaActiva" 
    [isVisible]="true" 
    [title]="'Menú'"  
    (msm_success)="onMsmSuccess($event)" 
    [refreshCasProducts]="refreshCasProducts">
</app-cas-products>
    
    <!-- Hero Section -->
    <app-hero></app-hero>
   
    <!-- Subcategorías adicionales con Lazy Loading (Se cargan al hacer scroll) -->
    <!-- Lazy loaded secondary sections -->
@defer (on viewport) {
    <app-cat-adicionales *ngIf="!isLoading && categoriaActiva" [activeCategory]="'Entradas'" [title]="'Entradas'"></app-cat-adicionales>
} @placeholder {
    <div class="loading-placeholder" style="text-align: center; padding: 20px;">Cargando Entradas...</div>
}

@defer (on viewport) {
    <app-cat-adicionales *ngIf="!isLoading && categoriaActiva" [activeCategory]="'Bebidas'" [title]="'Bebidas'"></app-cat-adicionales>
} @placeholder {
    <div class="loading-placeholder" style="text-align: center; padding: 20px;">Cargando Bebidas...</div>
}

@defer (on viewport) {
    <app-cat-adicionales *ngIf="!isLoading && categoriaActiva" [activeCategory]="'Postres'" [title]="'Postres'"></app-cat-adicionales>
} @placeholder {
    <div class="loading-placeholder" style="text-align: center; padding: 20px;">Cargando Postres...</div>
}


   
    <app-pwa-notif-installer></app-pwa-notif-installer>
    <app-modal-inicial></app-modal-inicial>
    
    <!-- Footer -->
    <app-menu-footer></app-menu-footer>
    <app-footer></app-footer>
</div>
