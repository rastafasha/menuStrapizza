<app-header (refreshApp)="onRefreshFromHeader()" ></app-header>
<!-- <p>home works!</p> -->
<!-- Carrousel Section -->
<app-loading *ngIf="isLoading"></app-loading>
<div *ngIf="!isLoading">
    <!-- <app-slider></app-slider> -->
    <!-- Free Delivery Section -->
    <!-- <app-free-delivery></app-free-delivery> -->
    <div class="clear"></div>
    <br>
    <!-- Categories Section - Loads immediately (most important) -->
    <app-cas-products *ngIf="!isLoading && nombreSelected ==='Pizzeria'" [activeCategory]="'Pizzería'" [activeSubCategory]="'Pizza'" [isVisible]="true" [title]="'Carta'"  (msm_success)="onMsmSuccess($event)" [refreshCasProducts]="refreshCasProducts"></app-cas-products>
    <app-cas-products *ngIf="!isLoading && nombreSelected ==='Slidedish'" [activeCategory]="'Panadería'" [activeSubCategory]="'Delicateses'" [isVisible]="true" [title]="'Carta'"  (msm_success)="onMsmSuccess($event)" [refreshCasProducts]="refreshCasProducts"></app-cas-products>
    
    <!-- Hero Section - Loads immediately -->
    <app-hero ></app-hero>
    
    <!-- Lazy loaded secondary sections - Only load when user scrolls to them -->
    @defer (on viewport) {
        <app-cas-products *ngIf="!isLoading && nombreSelected ==='Pizzeria'" [activeCategory]="'Entradas'" [title]="'Entradas'"  (msm_success)="onMsmSuccess($event)" [refreshCasProducts]="refreshCasProducts"></app-cas-products>
    } @placeholder {
        <div class="loading-placeholder" style="text-align: center; padding: 20px;">
            Cargando Entradas...
        </div>
    } @loading {
        <app-loading *ngIf="isLoading"></app-loading>
    }
    @defer (on viewport) {
        <app-cas-products *ngIf="!isLoading && nombreSelected ==='Pizzeria'" [activeCategory]="'Combos'" [title]="'Combos'"  (msm_success)="onMsmSuccess($event)" [refreshCasProducts]="refreshCasProducts"></app-cas-products>
    } @placeholder {
        <div class="loading-placeholder" style="text-align: center; padding: 20px;">
            Cargando Combos...
        </div>
    } @loading {
        <app-loading *ngIf="isLoading"></app-loading>
    }
    @defer (on viewport) {
        <app-cas-products *ngIf="!isLoading && nombreSelected ==='Pizzeria'" [activeCategory]="'Bebidas'" [title]="'Bebidas'"  (msm_success)="onMsmSuccess($event)" [refreshCasProducts]="refreshCasProducts"></app-cas-products>
    } @placeholder {
        <div class="loading-placeholder" style="text-align: center; padding: 20px;">
            Cargando Bebidas...
        </div>
    } @loading {
        <app-loading *ngIf="isLoading"></app-loading>
    }
    @defer (on viewport) {
        <app-cas-products *ngIf="!isLoading && nombreSelected ==='Pizzeria'" [activeCategory]="'Postres'" [title]="'Postres'"  (msm_success)="onMsmSuccess($event)" [refreshCasProducts]="refreshCasProducts"></app-cas-products>
    } @placeholder {
        <div class="loading-placeholder" style="text-align: center; padding: 20px;">
            Cargando Postres...
        </div>
    } @loading {
        <app-loading *ngIf="isLoading"></app-loading>
    }
   
<app-pwa-notif-installer></app-pwa-notif-installer>
    <!-- Footer -->
    <app-menu-footer *ngIf="user"></app-menu-footer>
    <app-footer ></app-footer>
</div>
