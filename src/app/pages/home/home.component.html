<app-header (refreshApp)="onRefreshFromHeader()"></app-header>

<app-loading *ngIf="isLoading"></app-loading>
<div *ngIf="!isLoading">
    
    
    <br>
    <!-- Catálogo Principal (Carga de inmediato) -->
    <!-- Eliminamos el filtro manual por texto; el componente interno ya sabe qué cargar usando la tienda activa -->
    <app-cas-products 
    *ngIf="!isLoading" 
    [activeCategory]="categoriaActiva" 
    [isVisible]="true" 
    [title]="'Menú' | translate"  
    (msm_success)="onMsmSuccess($event)" 
    [refreshCasProducts]="refreshCasProducts" style="margin-top: 15px;">
</app-cas-products>
    <div class="d-flex justify-content-end align-items-center" style="margin-right: 15px;">
      <!-- <app-backButtn pageTitle="Mis Pagos"></app-backButtn> -->
      <button class="btn btn-outline-primary btn-sm rounded-circle shadow-sm" (click)="modalInicial.open()"
        title="Ayuda de la sección">
        <i class="fa fa-question"></i>
      </button>
    </div>
    <!-- Hero Section -->
    <app-hero></app-hero>
   
    <!-- Subcategorías adicionales con Lazy Loading (Se cargan al hacer scroll) -->
    <!-- Lazy loaded secondary sections -->
@defer (on viewport) {
    <app-cat-adicionales *ngIf="!isLoading && categoriaActiva" [activeCategory]="'Entradas' " [title]="'Entradas' | translate"></app-cat-adicionales>
} @placeholder {
    <div class="loading-placeholder" style="text-align: center; padding: 20px;">...</div>
}
@defer (on viewport) {
    <app-cat-adicionales *ngIf="!isLoading && categoriaActiva" [activeCategory]="'Combos' " [title]="'Combos' | translate"></app-cat-adicionales>
} @placeholder {
    <div class="loading-placeholder" style="text-align: center; padding: 20px;">...</div>
}

@defer (on viewport) {
    <app-cat-adicionales *ngIf="!isLoading && categoriaActiva" [activeCategory]="'Bebidas'" [title]="'Bebidas' | translate"></app-cat-adicionales>
} @placeholder {
    <div class="loading-placeholder" style="text-align: center; padding: 20px;">...</div>
}

@defer (on viewport) {
    <app-cat-adicionales *ngIf="!isLoading && categoriaActiva" [activeCategory]="'Postres' " [title]="'Postres' | translate"></app-cat-adicionales>
} @placeholder {
    <div class="loading-placeholder" style="text-align: center; padding: 20px;">...</div>
}
