<section class="categories-section" [id]="title?.toLowerCase()">
    <div class="container">
        
        <!-- Título de la sección secundaria (ej: Entradas, Bebidas, etc.) -->
        <div class="title-section" *ngIf="title">
            <h3 class="title">{{title}}</h3>
        </div>

        <app-loading *ngIf="isLoading"></app-loading>
        
        <div *ngIf="!isLoading">
            <!-- Menú de pestañas dinámicas filtradas -->
            <div class="tab-content-set">
                <ul class="nav" *ngFor="let category of subcategories"
                    [class.active]="activeCategory === category.nombre">
                    <li>
                        <a href="#" onclick="return false;" [ngClass]="{'active': activeCategory === category.nombre}"
                            (click)="selectCategory(category.nombre)">{{ category.nombre }}</a>
                    </li>
                </ul>
            </div>

            <!-- Grilla de productos de la subcategoría seleccionada -->
            <div class="product-card" *ngFor="let product of todo; let i = index">
                <app-product-item 
                    [activeCategory]="activeCategory" 
                    [tienda_moneda]="tienda_moneda"  
                    [product]="product"
                    data-bs-toggle="offcanvas" 
                    [attr.data-bs-target]="'#modalProduct-' + product._id"
                    (click)="openModal(product)">
                </app-product-item>
            </div>
        </div>
    </div>
</section>

<div class="clear"></div>

<!-- Modal de producto integrado -->
<app-modalproduct 
    [product]="selectedProduct" 
    [activeCategory]="activeCategory" 
    [tienda_moneda]="tienda_moneda"
    (modalClosed)="selectedProduct = null"  
    *ngIf="selectedProduct && !isLoading">
</app-modalproduct>
