<section class="categories-section" [id]="title?.toLowerCase()">
    <div class="container">
        
        <!-- Título de la sección (Entradas, Combos, Bebidas o Postres) -->
        <div class="title-section" *ngIf="title">
            <h3 class="title">{{title}}</h3>
        </div>

        <!-- Indicador de carga -->
        <app-loading *ngIf="isLoading"></app-loading>
        
        <!-- Grilla de productos filtrados -->
        <div *ngIf="!isLoading">
            <div class="product-card" *ngFor="let product of todo">
                <app-product-item 
                    [activeCategory]="activeCategory" 
                    [tienda_moneda]="tienda_moneda" 
                    [product]="product"
                    (onVerDetalles)="selectedProduct = $event">
                </app-product-item>
            </div>
        </div>

    </div>
</section>

<div class="clear"></div>

<!-- Modal independiente para ver el detalle del producto seleccionado -->
<app-modalproduct 
    [product]="selectedProduct" 
    [activeCategory]="activeCategory" 
    [tienda_moneda]="tienda_moneda"
    (modalClosed)="selectedProduct = null"  
    *ngIf="selectedProduct && !isLoading">
</app-modalproduct>
