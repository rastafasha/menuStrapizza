<section class="hero" id="inicio" [style.background-color]="tiendaSelected?.color_fondo">
    <div class="hero-container">
        <div class="hero-content">
            
            <!-- CONTENEDOR ÚNICO Y DINÁMICO (Reemplaza a los 3 bloques anteriores) -->
            <div>
                <h1 class="hero-title">
                    {{ obtenerTextoPrevio() }} <span>{{ obtenerTextoDestacado() }}</span><br>{{ obtenerTextoPost() }}
                </h1>
                
                <div class="hero-image">
                    <!-- Si el restaurante subió su propia foto en 'img_hero' se usa, si no, carga la de la subcategoría por defecto -->
                    <img [src]="tiendaSelected?.img_hero || obtenerImagenPorDefecto()" 
                         [alt]="tiendaSelected?.nombre || 'Plato Principal'">
                </div>
            </div>
           
            <p class="hero-subtitle">
                {{ tiendaSelected?.descripcion_hero || 'Descubre el verdadero sabor con nuestros ingredientes frescos y recetas tradicionales transmitidas por generaciones.' }}
                <br><br>
                Comienza a agregar productos al carrito ya!
            </p>
            
            <!-- <div class="botns">
                <a routerLink="registro" class="btn-primary" *ngIf="!isLogued">
                    <i class="fas fa-pizza-slice"></i> Registrarme
                </a>
                <a routerLink="my-account" class="btn-primary">
                    <i class="fas fa-user"></i> Ingresar a mi Cuenta
                </a>
            </div> -->
        </div>
    </div>
</section>
<div class="clear"></div>
