<section class="categories-section" id="categorias">
    <div class="container">
        <div class="title-section">
            <h3 class="title">{{title}}</h3>
        </div>

        <app-loading *ngIf="isLoading"></app-loading>
        <div *ngIf="!isLoading">
            <div class="tab-content-set">
                <ul class="nav" *ngFor="let category of subcategories"
                    [class.active]="activeCategory === category.nombre">
                    <li>
                        <a href="#" onclick="return false;" [ngClass]="{'active': option_selectedd == 1}"
                            (click)="selectCategory(category.nombre)">{{ category.nombre }}</a>
                    </li>
                </ul>
            </div>
            <div class="product-card" *ngFor="let product of todo; let i = index" cdkDrag>
                <app-product-item 
                [activeCategory]="activeCategory" 
                [tienda_moneda]="tienda_moneda" 
                [product]="product"
                (onVerDetalles)="selectedProduct = $event">
                </app-product-item>
            </div>
        </div>


    </div>
</section>
<div class="clear"></div>

<app-modalproduct 
    [product]="selectedProduct" 
    [activeCategory]="activeCategory" 
    [tienda_moneda]="tienda_moneda"
    (modalClosed)="selectedProduct = null"  
    *ngIf="selectedProduct && !isLoading">
</app-modalproduct>
