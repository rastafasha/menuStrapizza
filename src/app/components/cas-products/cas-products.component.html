<section class="categories-section" id="categorias">
    <div class="container">
        <div class="title-section">
            <h3 class="title">{{title}}</h3>
        </div>

        <app-loading *ngIf="isLoading"></app-loading>
        <div *ngIf="!isLoading">
            
            <!-- Menú de pestañas / Filtros de Subcategorías -->
            <div class="tab-content-set">
                <ul class="nav">
                    <!-- 1. Botón estático para ver TODO el catálogo de la categoría -->
                    <li [class.active]="activeCategory === 'all'">
                        <a href="#" onclick="return false;" 
                           [ngClass]="{'active': activeCategory === 'all'}"
                           (click)="selectCategory('all')">
                           Todo
                        </a>
                    </li>
                    
                    <!-- 2. Ciclo de subcategorías dinámicas de tus productos -->
                    <ng-container *ngFor="let category of subcategories">
                        <li [class.active]="activeCategory.toLowerCase() === category.nombre.toLowerCase()">
                            <a href="#" onclick="return false;" 
                               [ngClass]="{'active': activeCategory.toLowerCase() === category.nombre.toLowerCase()}"
                               (click)="selectCategory(category.nombre)">
                               {{ category.nombre }}
                            </a>
                        </li>
                    </ng-container>
                </ul>
            </div>

            <!-- Grilla / Lista de productos -->
            <div class="product-card" *ngFor="let product of todo; let i = index">
                <app-product-item 
                    [activeCategory]="activeCategory" 
                    [tienda_moneda]="tienda_moneda" 
                    [product]="product"
                    (onVerDetalles)="selectedProduct = $event">
                </app-product-item>
            </div>
        </div>
    </div>
</section>
<div class="clear"></div>

<app-modalproduct 
    [product]="selectedProduct" 
    [activeCategory]="activeCategory" 
    [tienda_moneda]="tienda_moneda"
    (modalClosed)="selectedProduct = null"  
    *ngIf="selectedProduct && !isLoading">
</app-modalproduct>
